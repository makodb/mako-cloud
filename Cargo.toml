[workspace]
members = ["crates/*", "services/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
async-trait = "0.1"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.6"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "3.0.0"
futures = "0.3"
hmac = "0.12.1"
fs2 = "0.4.3"
jsonschema = { version = "0.49.6", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
proptest = "1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime", "multi-threaded-cf", "snappy"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
signal-hook = "0.3.18"
tiny_http = "0.12.0"
url = "2"
tempfile = "3"
time = { version = "0.3.44", features = ["formatting", "parsing"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
