      oneOf:
        - type: object
          required: [event, data]
          properties:
            event:
              const: documents
            data:
              type: object
              required: [documents, checkpoint, cursor]
              properties:
                documents:
                  type: array
                  items:
                    $ref: "#/components/schemas/JsonDocument"
                checkpoint:
                  $ref: "#/components/schemas/Checkpoint"
                cursor:
                  $ref: "#/components/schemas/StreamCursor"
        - type: object
          required: [event, data]
          properties:
            event:
              const: checkpoint
            data:
              type: object
              required: [checkpoint, cursor]
              properties:
                checkpoint:
                  $ref: "#/components/schemas/Checkpoint"
                cursor:
                  $ref: "#/components/schemas/StreamCursor"
        - type: object
          required: [event, data]
          properties:
            event:
              const: heartbeat
            data:
              type: object
              required: [cursor]
              properties:
                cursor:
                  $ref: "#/components/schemas/StreamCursor"
        - type: object
          required: [event, data]
          properties:
            event:
              const: resync
            data:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum:
                    - reconnected
                    - stream_gap
                    - checkpoint_expired
                    - authorization_epoch_changed
                    - service_failover
