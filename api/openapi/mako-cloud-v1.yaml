                $ref: "#/components/schemas/DataJob"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/data-jobs/{jobId}/artifact-grants/upload:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
      - $ref: "#/components/parameters/DataJobId"
    post:
      tags: [Developer Workspace]
      operationId: createDataJobUploadGrant
      responses:
        "201":
          description: Short-lived tenant- and digest-bound artifact grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactGrant"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/data-jobs/{jobId}/artifact-grants/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
      - $ref: "#/components/parameters/DataJobId"
    post:
      tags: [Developer Workspace]
      operationId: createDataJobDownloadGrant
      responses:
        "201":
          description: Short-lived tenant- and digest-bound artifact grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactGrant"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/data-jobs/{jobId}/artifact:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
      - $ref: "#/components/parameters/DataJobId"
      - name: grant
        in: query
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 16384
    put:
      tags: [Developer Workspace]
      operationId: uploadDataJobArtifact
      summary: Consume a short-lived tenant-bound import upload grant
      parameters:
        - name: Digest
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha-256=[a-f0-9]{64}$"
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
              maxLength: 536870912
      responses:
        "202":
          description: Immutable upload accepted and digest verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataJob"
        default:
          $ref: "#/components/responses/ApiError"
    get:
      tags: [Developer Workspace]
      operationId: downloadDataJobArtifact
      summary: Consume a short-lived tenant- and digest-bound export download grant
      responses:
        "200":
          description: Complete verified JSON Lines export; partial artifacts are never served
          headers:
            Digest:
              schema:
                type: string
                pattern: "^sha-256=[a-f0-9]{64}$"
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
                maxLength: 536870912
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/workspace/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      tags: [Developer Workspace]
      operationId: getWorkspaceSummary
      summary: Read independently fresh project-environment overview sections
      responses:
        "200":
          description: Partial-success workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/developer-auth/sessions/current/actions/verify-password:
    post:
      tags: [Auth]
      operationId: verifyCurrentDeveloperPassword
      summary: Issue a five-minute session-bound step-up token after password verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        "200":
          description: Session-bound step-up grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperStepUpGrant"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/workspace/navigation:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      tags: [Developer Workspace]
      operationId: getWorkspaceNavigation
      summary: Read permission-filtered workspace destinations
      responses:
        "200":
          description: Workspace navigation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceDestination"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/connect:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      tags: [Developer Workspace]
      operationId: getConnectMetadata
      summary: Read public-only RxDB connection metadata and compatibility
      responses:
        "200":
          description: Public connect metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMetadata"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/connect/check:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    post:
      tags: [Developer Workspace]
      operationId: checkConnection
      summary: Run bounded non-document DNS TLS route key schema and replication probes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCheckRequest"
      responses:
        "200":
          description: Safe connection steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionCheck"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/sync/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      tags: [Developer Workspace]
      operationId: getSyncSummary
      summary: Read bounded tenant aggregate RxDB synchronization diagnostics
      parameters:
        - name: collectionId
          in: query
          schema:
            $ref: "#/components/schemas/CollectionId"
        - name: from
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: until
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Sync aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSummary"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/backups:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EnvironmentId"
    get:
      tags: [Developer Workspace]
      operationId: listDeveloperBackups
      summary: List verified tenant-scoped recovery points without infrastructure fields
      responses:
        "200":
          description: Verified backup inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeveloperBackup"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/restore-requests:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Developer Workspace]
      operationId: listDeveloperRestoreRequests
      responses:
        "200":
          description: Bounded project restore-request list
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/DeveloperRestore"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Developer Workspace]
      operationId: requestDeveloperRestore
      summary: Request a stepped-up restore into a new isolated environment only
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperRestoreRequest"
      responses:
        "202":
          description: Restore request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperRestore"
        default:
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    managementBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Disabled-by-default incident break-glass credential; never used by the hosted console
    operatorSessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-mako_operator
    waitlistBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    developerRefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-mako_developer_refresh
    publicProjectKey:
      type: apiKey
      in: header
      name: X-Mako-Key
    serviceProjectKey:
      type: apiKey
      in: header
      name: X-Mako-Service-Key
    explorerCapability:
      type: apiKey
      in: header
      name: X-Mako-Explorer-Capability
      description: In-memory-only signed capability with a maximum five-minute lifetime
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OrganizationId"
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InvitationId"
    DeveloperIdentityId:
      name: developerIdentityId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DeveloperIdentityId"
    AutomationTokenId:
      name: automationTokenId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AutomationTokenId"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProjectId"
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EnvironmentId"
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CollectionId"
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DocumentId"
    DataJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^djob_[A-Za-z0-9_-]{8,75}$"
    ServiceBypassReason:
      name: X-Mako-Bypass-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ServiceRequestId:
      name: X-Mako-Request-Id
      in: header
      required: true
      schema:
        type: string
        pattern: "^req_[A-Za-z0-9_-]{4,124}$"
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SchemaMigrationId"
    IndexName:
      name: indexName
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    IndexVersion:
      name: indexVersion
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PolicyVersion:
      name: policyVersion
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ApplicationUserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApplicationUserId"
    ApplicationSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ApplicationSessionId"
    ProjectCredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProjectCredentialId"
    FunctionSecretName:
      name: secretName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FunctionSecretName"
    FunctionName:
      name: functionName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FunctionName"
    FunctionVersion:
      name: functionVersion
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ObservabilityCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor that expires with the signal retention window.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    ObservabilityFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ObservabilityUntil:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ObservabilityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    ProvisioningWorkflowId:
      name: provisioningWorkflowId
      in: path
      required: true
      schema:
        type: string
        pattern: "^wf_[A-Za-z0-9_-]{8,96}$"
    SupportSessionId:
      name: supportSessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SupportSessionId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
  responses:
    DeveloperGenericAccepted:
      description: Enumeration-safe request acceptance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeveloperGenericAccepted"
    ApiError:
      description: Versioned public API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    OperatorAuthenticationFailed:
      description: Generic operator authentication failure with no identity disclosure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
          examples:
            generic:
              value:
                apiVersion: v1
                error:
                  code: unauthenticated
                  message: The email or password was not accepted.
                  requestId: req_redacted
                  retry:
                    kind: never
    OperatorAuthenticationThrottled:
      description: Generic bounded operator authentication throttling
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            maximum: 3600
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
          examples:
            generic:
              value:
                apiVersion: v1
                error:
                  code: rate_limited
                  message: Too many attempts. Try again later.
                  requestId: req_redacted
                  retry:
                    kind: after_delay
                    afterMs: 1000
    ObservabilityPage:
      description: Retention-bounded page of project signals
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ObservabilityPage"
  schemas:
    TenantScope:
      type: object
      additionalProperties: false
      required: [projectId, environmentId]
      properties:
        projectId:
          $ref: "#/components/schemas/ProjectId"
        environmentId:
          $ref: "#/components/schemas/EnvironmentId"
    ExplorerAccessMode:
      type: string
      enum: [policy_preview, administrative]
    ExplorerOperation:
      type: string
      enum: [get, browse, query, plan, history, simulate, mutate, import, export]
    ExplorerGrantRequest:
      type: object
      additionalProperties: false
      required: [tenant, collectionId, mode, operations, durationSeconds]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantScope"
        collectionId:
          $ref: "#/components/schemas/CollectionId"
        mode:
          $ref: "#/components/schemas/ExplorerAccessMode"
        operations:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ExplorerOperation"
        applicationUserId:
          type: [string, "null"]
        reason:
          type: [string, "null"]
          maxLength: 500
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 300
    ExplorerGrant:
      type: object
      additionalProperties: false
      required: [grantId, capability, mode, operations, issuedAtUnixSeconds, expiresAtUnixSeconds, authorizationEpoch]
      properties:
        grantId:
          type: string
        capability:
          type: string
          writeOnly: true
          description: Keep in memory only; never place in URLs, logs, analytics, or browser storage
        mode:
          $ref: "#/components/schemas/ExplorerAccessMode"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerOperation"
        applicationUserId:
          type: [string, "null"]
        issuedAtUnixSeconds:
          type: integer
        expiresAtUnixSeconds:
          type: integer
        authorizationEpoch:
          type: integer
          minimum: 1
    ExplorerGrantRevocation:
      type: object
      required: [grantId, revokedAtUnixSeconds]
      properties:
        grantId:
          type: string
        revokedAtUnixSeconds:
          type: integer
    ExplorerPageRequest:
      type: object
      additionalProperties: false
      required: [limit, cursor, includeRetainedTombstones]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        cursor:
          type: [string, "null"]
          maxLength: 8192
        includeRetainedTombstones:
          type: boolean
    ExplorerDocument:
      type: object
      additionalProperties: false
      required: [documentId, revision, schemaVersion, deleted, content]
      properties:
        documentId:
          type: string
        revision:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        deleted:
          type: boolean
        content:
          type: [object, "null"]
          additionalProperties: true
    ExplorerDocumentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, snapshot, exhausted]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExplorerDocument"
        nextCursor:
          type: [string, "null"]
        snapshot:
          type: string
        exhausted:
          type: boolean
    ExplorerPredicate:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          maxLength: 512
        operator:
          type: string
          enum: [equal, greater_than, greater_than_or_equal, less_than, less_than_or_equal]
        value: {}
    ExplorerSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
          maxLength: 512
        direction:
          type: string
          enum: [ascending, descending]
    ExplorerQueryRequest:
      type: object
      additionalProperties: false
      required: [predicates, sort, limit, cursor]
      properties:
        predicates:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ExplorerPredicate"
        sort:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ExplorerSort"
        limit:
          type: integer
          minimum: 1
          maximum: 200
        cursor:
          type: [string, "null"]
          maxLength: 8192
    ExplorerQueryPlan:
      type: object
      additionalProperties: false
      required: [supported, indexName, effectiveOrder, effectiveLimit, queryFingerprint, requiredIndex]
      properties:
        supported:
          type: boolean
        indexName:
          type: [string, "null"]
        effectiveOrder:
          type: array
          items:
            $ref: "#/components/schemas/ExplorerSort"
        effectiveLimit:
          type: integer
        queryFingerprint:
          type: string
        requiredIndex:
          type: [object, "null"]
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ExplorerSort"
    ExplorerMutationRequest:
      type: object
      additionalProperties: false
      required: [kind, documentId, expectedRevision, schemaVersion, idempotencyKey, content]
      properties:
        kind:
          type: string
          enum: [create, update, delete]
        documentId:
          type: string
        expectedRevision:
          type: [string, "null"]
        schemaVersion:
          type: integer
          minimum: 1
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 200
        content:
          type: [object, "null"]
          additionalProperties: true
    ExplorerSimulation:
      type: object
      required: [allowed, schemaValid, diagnostics, wouldConflict]
      properties:
        allowed:
          type: boolean
        schemaValid:
          type: boolean
        diagnostics:
          type: array
          maxItems: 100
          items:
            type: string
        wouldConflict:
          type: boolean
    ExplorerMutationResult:
      type: object
      required: [committed, document, conflict, auditReference]
      properties:
        committed:
          type: boolean
        document:
          oneOf:
            - $ref: "#/components/schemas/ExplorerDocument"
            - type: "null"
        conflict:
          oneOf:
            - $ref: "#/components/schemas/ExplorerDocument"
            - type: "null"
        auditReference:
          type: string
    ExplorerRevision:
      type: object
      required: [revision, schemaVersion, commitPosition, committedAtUnixSeconds, deleted, retainedUntilUnixSeconds]
      properties:
        revision:
          type: string
        schemaVersion:
          type: integer
        commitPosition:
          type: integer
        committedAtUnixSeconds:
          type: [integer, "null"]
        deleted:
          type: boolean
        retainedUntilUnixSeconds:
          type: [integer, "null"]
    DataJob:
      type: object
      additionalProperties: false
      required: [jobId, kind, state, tenant, collectionId, creatorId, conflictStrategy, progress, errors, manifest, createdAtUnixSeconds, updatedAtUnixSeconds, expiresAtUnixSeconds]
      properties:
        jobId:
          type: string
        kind:
          type: string
          enum: [import, export]
        state:
          type: string
          enum: [awaiting_upload, dry_run, awaiting_confirmation, queued, running, cancelling, succeeded, failed, cancelled, expired]
        tenant:
          $ref: "#/components/schemas/TenantScope"
        collectionId:
          $ref: "#/components/schemas/CollectionId"
        creatorId:
          type: string
        conflictStrategy:
          type: [string, "null"]
          enum: [create_only, update_existing, upsert, null]
        progress:
          $ref: "#/components/schemas/DataJobProgress"
        errors:
          type: array
          maxItems: 100
          items:
            type: string
        manifest:
          oneOf:
            - $ref: "#/components/schemas/DataJobManifest"
            - type: "null"
        createdAtUnixSeconds:
          type: integer
        updatedAtUnixSeconds:
          type: integer
        expiresAtUnixSeconds:
          type: integer
    DataJobProgress:
      type: object
      additionalProperties: false
      required: [processed, committed, failed, skipped, exported, bytes]
      properties:
        processed:
          type: integer
          minimum: 0
        committed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        exported:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
    DataJobManifest:
      type: object
      additionalProperties: false
      required: [formatVersion, tenant, collectionId, schemaVersion, snapshot, rowCount, byteCount, digest, finalizedAtUnixSeconds]
      properties:
        formatVersion:
          type: integer
          enum: [1]
        tenant:
          $ref: "#/components/schemas/TenantScope"
        collectionId:
          $ref: "#/components/schemas/CollectionId"
        schemaVersion:
          type: integer
          minimum: 1
        snapshot:
          type: [string, "null"]
        rowCount:
          type: integer
          minimum: 0
        byteCount:
          type: integer
          minimum: 0
          maximum: 536870912
        digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        finalizedAtUnixSeconds:
          type: integer
          minimum: 0
    DataJobCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, collectionId]
      properties:
        kind:
          type: string
          enum: [import, export]
        collectionId:
          $ref: "#/components/schemas/CollectionId"
        conflictStrategy:
          type: [string, "null"]
          enum: [create_only, update_existing, upsert, null]
    DataJobDryRunRequest:
      type: object
      additionalProperties: false
      required: [uploadDigest, schemaVersion]
      properties:
        uploadDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        schemaVersion:
          type: integer
          format: int64
          minimum: 1
    DataJobConfirmationRequest:
      type: object
      additionalProperties: false
      required: [expectedManifestDigest, acknowledgePartialImportCancellation]
      properties:
        expectedManifestDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        acknowledgePartialImportCancellation:
          type: boolean
    ArtifactGrant:
      type: object
