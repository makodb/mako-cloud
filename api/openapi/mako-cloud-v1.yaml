  /v1/operator/organizations/{organizationId}/plan:
    post:
      tags: [Operator]
      operationId: changeOrganizationPlan
      summary: Move an organization to another plan
      description: >-
        The beta's comped plan change: nothing sells plans, so an operator
        granting one is the only way onto a paid tier. The change is audited,
        and the limits each of the organization's environments is held to are
        reinstalled before the change is reported.
      security:
        - operatorSessionCookie: []
        - operatorBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planId, reason]
              properties:
                planId: {type: string, minLength: 1, maxLength: 64}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "200":
          description: The organization's plan after the change
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organizationId, planId, updatedAt]
                properties:
                  organizationId: {$ref: "#/components/schemas/OrganizationId"}
                  planId: {type: string}
                  updatedAt: {type: string, format: date-time}
        default: {$ref: "#/components/responses/ApiError"}
  /v1/operator/organizations/{organizationId}/plan-exceptions:
    put:
      tags: [Operator]
      operationId: setOrganizationPlanExceptions
      summary: Replace the exceptions to an organization's plan
      description: >-
        The operator states what is exceptional right now; an empty set clears
        everything. Each exception names one resource, carries a reason, and
        may expire, after which the organization is back on its plan. The
        limits every environment is held to are reinstalled before the change
        is reported.
      security:
        - operatorSessionCookie: []
        - operatorBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exceptions, reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
                exceptions:
                  type: array
                  maxItems: 16
                  items:
                    $ref: "#/components/schemas/PlanException"
      responses:
        "200":
          description: The exceptions now in force
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organizationId, exceptions]
                properties:
                  organizationId: {$ref: "#/components/schemas/OrganizationId"}
                  exceptions:
                    type: array
                    maxItems: 16
                    items:
                      $ref: "#/components/schemas/PlanException"
        default: {$ref: "#/components/responses/ApiError"}
  /v1/operator/organizations/{organizationId}/credits:
    post:
      tags: [Operator]
      operationId: grantOrganizationCredit
      summary: Grant an organization a credit
      description: >-
        Moves the shown balance and nothing else. Exactly-once per credit id:
        replaying the same id conflicts rather than granting twice. A credit
        cannot be negative -- taking money away is not a credit.
      security:
        - operatorSessionCookie: []
        - operatorBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, amountMicroDollars, reason]
              properties:
                id: {type: string, pattern: "^crd_[A-Za-z0-9_-]{4,64}$"}
                amountMicroDollars: {type: integer, format: int64, minimum: 1}
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        "201":
          description: The granted credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credit"
        default: {$ref: "#/components/responses/ApiError"}
