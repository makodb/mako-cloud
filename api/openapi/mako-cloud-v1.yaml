openapi: 3.1.0
info:
  title: Mako Cloud API
  version: 1.0.0
  description: >-
    Versioned management, project authentication, RxDB replication, edge
    function, and operator contracts for Mako Cloud.
servers:
  - url: https://api.mako.cloud
tags:
  - name: Management
  - name: Auth
  - name: Documents
  - name: Replication
  - name: Functions
  - name: Operator
  - name: Explorer
  - name: Developer Workspace
security:
  - managementBearer: []
paths:
  /v1/organizations:
    get:
      tags: [Management]
      operationId: listOrganizations
      summary: List organizations visible to the developer
      responses:
        "200":
          description: Organization page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createOrganization
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/bill:
    get:
      tags: [Management]
      operationId: getOrganizationBill
      summary: The organization's informational bill for the current period
      description: >-
        What the organization's metered use would cost under its plan and the
        current rate card, and the balance it implies. Informational only:
        nothing is payable and no charge is made during the beta, and the
        response says so explicitly.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: The rated current period and resulting balance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - organizationId
                  - planId
                  - periodStart
                  - observedAt
                  - baseMicroDollars
                  - lineItems
                  - totalMicroDollars
                  - creditsMicroDollars
                  - balanceMicroDollars
                  - collectable
                  - notice
                properties:
                  organizationId: {$ref: "#/components/schemas/OrganizationId"}
                  planId: {type: string}
                  periodStart: {type: string, format: date-time}
                  observedAt: {type: string, format: date-time}
                  baseMicroDollars: {type: integer, format: int64}
                  lineItems:
                    type: array
                    maxItems: 32
                    items:
                      type: object
                      additionalProperties: false
                      required: [resource, quantity, included, overage, amountMicroDollars]
                      properties:
                        resource: {$ref: "#/components/schemas/QuotaResource"}
                        quantity: {type: integer, format: int64, minimum: 0}
                        included: {type: integer, format: int64, minimum: 0}
                        overage: {type: integer, format: int64, minimum: 0}
                        amountMicroDollars: {type: integer, format: int64}
                  totalMicroDollars: {type: integer, format: int64}
                  creditsMicroDollars: {type: integer, format: int64}
                  balanceMicroDollars: {type: integer, format: int64}
                  collectable: {type: boolean}
                  notice: {type: string}
        default: {$ref: "#/components/responses/ApiError"}
  /v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Management]
      operationId: getOrganization
      summary: Inspect an organization visible to the developer or automation token
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
    patch:
      tags: [Management]
      operationId: updateOrganization
      summary: Update organization metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Management]
      operationId: requestOrganizationDeletion
      summary: Enter the organization deletion grace period
      parameters:
        - name: confirmation
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      responses:
        "202":
          description: Deletion grace period started and data-plane access revocation scheduled immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/actions/restore:
    post:
      tags: [Management]
      operationId: restoreOrganization
      summary: Restore an organization before its deletion grace deadline
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Organization restoration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/invitations:
    post:
      tags: [Management]
      operationId: createOrganizationInvitation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role, expiresAt]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/OrganizationRole"
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Invitation created; token is displayed only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationIssue"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/invitations/{invitationId}/accept:
    post:
      tags: [Management]
      operationId: acceptOrganizationInvitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 512
      responses:
        "200":
          description: Accepted organization membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembership"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/members:
    get:
      tags: [Management]
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMembership"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/members/{developerIdentityId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/DeveloperIdentityId"
    patch:
      tags: [Management]
      operationId: updateOrganizationMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/OrganizationRole"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembership"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Management]
      operationId: removeOrganizationMember
      responses:
        "204":
          description: Membership removed
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/automation-tokens:
    get:
      tags: [Management]
      operationId: listAutomationTokens
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Automation token metadata without token secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AutomationToken"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createAutomationToken
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope, expiresAt]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                scope:
                  $ref: "#/components/schemas/AutomationScope"
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Automation token created; secret is displayed only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationTokenIssue"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/automation-tokens/{automationTokenId}:
    delete:
      tags: [Management]
      operationId: revokeAutomationToken
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AutomationTokenId"
      responses:
        "204":
          description: Automation token revoked
        default:
          $ref: "#/components/responses/ApiError"
  /v1/organizations/{organizationId}/automation-tokens/{automationTokenId}/actions/rotate:
    post:
      tags: [Management]
      operationId: rotateAutomationToken
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AutomationTokenId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [replacementId, expiresAt]
              properties:
                replacementId:
                  $ref: "#/components/schemas/AutomationTokenId"
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Replacement token; secret is displayed only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationTokenIssue"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects:
    get:
      tags: [Management]
      operationId: listProjects
      summary: List projects visible in an organization
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OrganizationId"
      responses:
        "200":
          description: Organization projects
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createProject
      summary: Start asynchronous project provisioning
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, name, region]
              properties:
                organizationId:
                  $ref: "#/components/schemas/OrganizationId"
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                region:
                  type: string
                  minLength: 1
      responses:
        "202":
          description: Project provisioning accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}:
    get:
      tags: [Management]
      operationId: getProject
      summary: Get project and provisioning state
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Management]
      operationId: requestProjectDeletion
      summary: Enter the project deletion grace period and revoke new data-plane access
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: confirmation
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      responses:
        "202":
          description: Project deletion intent accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/actions/suspend:
    post:
      tags: [Management]
      operationId: suspendProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Project suspension accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/actions/restore:
    post:
      tags: [Management]
      operationId: restoreProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Project restoration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments:
    get:
      tags: [Management]
      operationId: listEnvironments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project environments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createEnvironment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "202":
          description: Environment provisioning accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}:
    get:
      tags: [Management]
      operationId: getEnvironment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: Environment and lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Management]
      operationId: requestEnvironmentDeletion
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - name: confirmation
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      responses:
        "202":
          description: Environment deletion intent accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/actions/suspend:
    post:
      tags: [Management]
      operationId: suspendEnvironment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Environment suspension accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/actions/restore:
    post:
      tags: [Management]
      operationId: restoreEnvironment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Environment restoration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections:
    get:
      tags: [Management]
      operationId: listCollections
      summary: List collections and active schema versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: Environment collections
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collection"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createCollection
      summary: Create a collection and its first active schema
      description: >-
        The collection is recorded, its metadata is installed in the data plane
        that serves the environment, and only then is it reported active. A
        collection returned with state `active` accepts document traffic. If the
        data plane cannot record the metadata the collection remains `creating`
        and the request fails with a retryable error; replaying the request with
        the same idempotency key converges.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created and active for document traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}:
    get:
      tags: [Management]
      operationId: getCollection
      summary: Inspect collection metadata and active schema
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Collection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}/schemas:
    post:
      tags: [Management]
      operationId: publishCollectionSchema
      summary: Publish a compatible schema or return migration requirements
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCollectionSchemaRequest"
      responses:
        "200":
          description: Publication or migration-required result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaPublicationResult"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}/migrations:
    post:
      tags: [Management]
      operationId: createSchemaMigration
      summary: Create an explicit workflow for an incompatible schema change
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchemaMigrationRequest"
      responses:
        "202":
          description: Migration workflow planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMigration"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}/migrations/{migrationId}:
    get:
      tags: [Management]
      operationId: getSchemaMigration
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/MigrationId"
      responses:
        "200":
          description: Migration state and compatibility diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMigration"
        default:
          $ref: "#/components/responses/ApiError"
    patch:
      tags: [Management]
      operationId: updateSchemaMigration
      summary: Advance, retry, complete, or cancel a migration workflow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/MigrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state:
                  $ref: "#/components/schemas/SchemaMigrationState"
      responses:
        "200":
          description: Updated migration workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMigration"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}/indexes:
    get:
      tags: [Management]
      operationId: listCollectionIndexes
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Index definitions and online build progress
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CollectionIndex"
        default:
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Management]
      operationId: createCollectionIndex
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionIndexRequest"
      responses:
        "202":
          description: Online index build accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionIndex"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/projects/{projectId}/environments/{environmentId}/collections/{collectionId}/indexes/{indexName}/{indexVersion}:
    get:
      tags: [Management]
      operationId: getCollectionIndex
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/IndexVersion"
      responses:
        "200":
          description: Index definition and online build progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionIndex"
        default:
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Management]
      operationId: deleteCollectionIndex
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/IndexVersion"
      responses:
        "202":
          description: Online index deletion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionIndex"
        default:
