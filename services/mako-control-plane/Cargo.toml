[package]
name = "mako-control-plane-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mako-control-plane"
path = "src/main.rs"

[[bin]]
name = "mako-control-session"
path = "src/bin/mako-control-session.rs"

[[bin]]
name = "mako-operator-session"
path = "src/bin/mako-operator-session.rs"

[[bin]]
name = "mako-operator-admin"
path = "src/bin/mako-operator-admin.rs"

[[bin]]
name = "mako-operator-projection"
path = "src/bin/mako-operator-projection.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
lettre.workspace = true
mako-api = { path = "../../crates/mako-api" }
mako-audit = { path = "../../crates/mako-audit" }
mako-config = { path = "../../crates/mako-config" }
mako-control-plane = { path = "../../crates/mako-control-plane" }
mako-documents = { path = "../../crates/mako-documents" }
mako-gateway = { path = "../../crates/mako-gateway" }
mako-identity = { path = "../../crates/mako-identity" }
mako-internal-rpc = { path = "../../crates/mako-internal-rpc" }
mako-object-store = { path = "../../crates/mako-object-store" }
mako-policy = { path = "../../crates/mako-policy" }
mako-provisioning = { path = "../../crates/mako-provisioning" }
mako-service-runtime = { path = "../../crates/mako-service-runtime" }
mako-storage = { path = "../../crates/mako-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true

[dev-dependencies]
mako-service-runtime = { path = "../../crates/mako-service-runtime", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
