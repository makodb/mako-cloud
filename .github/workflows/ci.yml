name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check generated API types
        run: npm run generate:api:check
      - name: Check published documentation
        run: npm run validate:docs
      - name: Check release-gate definitions
        run: npm run validate:release-gates
      - name: Check rollback qualification
        run: npm run validate:rollback
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check TypeScript and JSON formatting
        run: npm run format:check
      - name: Lint TypeScript
        run: npm run lint
      - name: Type-check TypeScript
        run: npm run typecheck

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit npm lockfile
        run: npm audit --audit-level=high
      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo lockfile
        run: cargo audit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test Rust units and binaries
        run: cargo test --workspace --lib --bins
      - name: Test TypeScript units
        run: npm run test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build service binaries for end-to-end targets
        run: cargo build --workspace --bins
      - name: Test Rust integration targets
        run: cargo test --workspace --tests
      - name: Test TypeScript integrations
        run: npm run test:integration

  end-to-end-smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - name: Drive the application happy path against the real services
        run: bash scripts/run-e2e-smoke-qualification.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the RxDB client the reference application imports
        run: npm run build --workspace @mako-cloud/rxdb
      - name: Install the browser runtime
        run: npx playwright install --with-deps chromium
      - name: Drive the reference application against the real services
        # The default browser suite runs these same six scenarios against an
        # in-browser fake. This one proves the server implements the other half.
        run: npm run test:browser-live
      - name: Publish smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-qualification
          path: docs/evidence/e2e-smoke-qualification.json
          if-no-files-found: warn

  public-beta-infrastructure:
    name: Public beta infrastructure (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: infra/ansible/requirements.txt
      - run: npm ci
      - name: Install pinned Ansible validation tools
        run: python -m pip install --requirement infra/ansible/requirements.txt
      - name: Build the console
        # The infrastructure validators inspect the built console bundle for its
        # same-origin configuration and hosted authentication. web-dist is a
        # generated directory, so CI builds it rather than reading a committed copy.
        run: npm run build --workspace @mako-cloud/console
      - name: Validate plan schema and collision fixtures
        run: |
          npm run test:proxmox-plan
          npm run test:proxmox-apply
          npm run test:proxmox-teardown
      - name: Lint cloud-init and Ansible assets
        env:
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          npm run validate:public-beta-infrastructure
          ansible-lint infra/ansible/playbooks/public-beta.yml
      - name: Validate firewall, Caddy, systemd, and retained evidence
        run: |
          npm run validate:public-beta-caddy
          npm run validate:public-beta-containers
          npm run validate:public-beta-services
          npm run validate:observability
      - name: Scan beta sources and evidence for secrets
        run: npm run scan:public-beta-secrets

  artifact-build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs:
      [format-and-lint, dependency-audit, unit-tests, integration-tests, public-beta-infrastructure]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --no-self-update
      - name: Use Rust toolchain
        run: rustup default 1.97.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Rust services
        run: cargo build --release --workspace --bins
      - name: Build TypeScript packages
        run: npm run build
      - name: Upload Rust services
        uses: actions/upload-artifact@v6
        with:
          name: mako-cloud-linux-services
          if-no-files-found: error
          path: |
            target/release/mako-data-plane
            target/release/mako-control-plane
            target/release/mako-edge-gateway
      - name: Upload TypeScript packages
        uses: actions/upload-artifact@v6
        with:
          name: mako-cloud-typescript
          if-no-files-found: error
          path: |
            packages/*/dist
            apps/*/dist
            examples/*/dist
            packages/*/package.json
