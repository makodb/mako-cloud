# The data-plane worker asks the running data plane for a linked checkpoint of
# itself over the signed loopback route, then finishes the backup from the copy.
# It reads the live volume marker but writes only the checkpoint directory,
# which it empties once the checkpoint is staged.
[Unit]
ConditionPathExists=/opt/mako/current/bin/mako-online-backup
ConditionPathExists=/etc/mako/credentials/internal-auth

[Service]
LoadCredential=internal-auth:/etc/mako/credentials/internal-auth
ReadWritePaths=/srv/mako-data/rocksdb/data-plane/.online-checkpoints
IPAddressAllow=localhost
