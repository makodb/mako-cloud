global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:9464"]
  - job_name: public-beta-host
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: mako-control-plane-developer-identity
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
