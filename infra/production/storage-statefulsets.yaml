            storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mako-production-backups
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: mako-retain-encrypted
  resources:
    requests:
      storage: 200Gi
